set -g mouse on 

# --- General Appearance ---
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#1e1e2e fg=#cdd6f4' # Dark base colors

# --- Left Side (Session Name) ---
# Shows a  icon and the session name
set -g status-left-length 20
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold]  #S #[default] "

# --- Window List (The tabs) ---
# Inactive window
setw -g window-status-format " #[fg=#6c7086]#I:#W "
# Active window with a  icon
setw -g window-status-current-format "#[fg=#fab387,bg=#313244,bold]  #I:#W #[default]"

# --- Right Side (Info) ---
# Shows  CPU (requires a script, but we'll use placeholder),    Date, and  Time
set -g status-right-length 50
set -g status-right "#[fg=#94e2d5]   %Y-%m-%d #[fg=#f9e2af] %H:%M #[fg=#1e1e2e,bg=#a6e3a1,bold]  #(whoami) "

# --- Pane Borders ---
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

