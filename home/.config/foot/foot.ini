[main]
font=Iosevka Nerd Font:size=16.5
font-bold=Iosevka Nerd Font:weight=bold:size=16.5
font-italic=Iosevka Nerd Font:slant=italic:size=16.5
font-bold-italic=Iosevka Nerd Font:weight=bold:slant=italic:size=16.5
pad=12x12
# Same pixel size on every screen (laptop 15" and Lenovo 24" are both 1080p),
# so text on the big monitor is as large as on the laptop instead of the same mm size
dpi-aware=no
include=~/.config/themes/current/foot-colors.ini

[tweak]
# Let Nerd Font icons draw at full size (2 cells) when followed by a space
overflowing-glyphs=yes
font-monospace-warn=no

[cursor]
style=beam
blink=yes