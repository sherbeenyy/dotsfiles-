format = """
[╭─](accent) $directory$git_branch$git_status$time
[╰─](accent) ${env_var.PET_OK}${env_var.PET_ERR}${env_var.PET_ZZ}${env_var.PET_HUNGRY}$character"""

palette = "everforest"

[palettes.everforest]
red = "#e67e80"
green = "#a7c080"
yellow = "#dbbc7f"
blue = "#7fbbb3"
magenta = "#d699b6"
cyan = "#83c092"
white = "#d3c6aa"
black = "#4b565c"
accent = "#a7c080"

[directory]
style = "green"
read_only = " "
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = " "
style = "yellow"
format = "on [$symbol$branch]($style) "

[git_status]
style = "red"
format = '([$all_status$ahead_behind]($style) )'

[time]
disabled = false
time_format = "%I:%M %p"
style = "blue"
format = "at [$time]($style) "

[character]
success_symbol = "[❯](accent)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

# Prompt cat (set by ~/.config/zsh/pet.zsh): one of these is set at a time
[env_var.PET_OK]
format = "[$env_value]($style) "
style = "accent"

[env_var.PET_ERR]
format = "[$env_value]($style) "
style = "red"

[env_var.PET_ZZ]
format = "[$env_value]($style) "
style = "blue"

[env_var.PET_HUNGRY]
format = "[$env_value]($style) "
style = "yellow"
