format = """
[╭─](accent) $directory$git_branch$git_status$time
[╰─](accent) ${env_var.PET_OK}${env_var.PET_ERR}${env_var.PET_ZZ}${env_var.PET_HUNGRY}$character"""

palette = "dracula"

[palettes.dracula]
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#bd93f9"
magenta = "#ff79c6"
cyan = "#8be9fd"
white = "#f8f8f2"
black = "#21222c"
accent = "#bd93f9"

[directory]
style = "magenta"
read_only = " "
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = " "
style = "cyan"
format = "on [$symbol$branch]($style) "

[git_status]
style = "red"
format = '([$all_status$ahead_behind]($style) )'

[time]
disabled = false
time_format = "%I:%M %p"
style = "green"
format = "at [$time]($style) "

[character]
success_symbol = "[❯](accent)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

# Prompt cat (set by ~/.config/zsh/pet.zsh): one of these is set at a time
[env_var.PET_OK]
format = "[$env_value]($style) "
style = "accent"

[env_var.PET_ERR]
format = "[$env_value]($style) "
style = "red"

[env_var.PET_ZZ]
format = "[$env_value]($style) "
style = "blue"

[env_var.PET_HUNGRY]
format = "[$env_value]($style) "
style = "yellow"
